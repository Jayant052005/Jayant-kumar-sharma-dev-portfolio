<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="grad-cc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#grad-cc)"/>
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#262626" stroke-width="2"/>

  <!-- Top bar -->
  <rect x="40" y="30" width="720" height="44" rx="4" fill="#141414" stroke="#292929"/>
  <circle cx="64" cy="52" r="5" fill="#E5252A"/>
  <circle cx="80" cy="52" r="5" fill="#444444"/>
  <circle cx="96" cy="52" r="5" fill="#444444"/>
  <text x="120" y="57" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#888888" letter-spacing="1">CIVICCONNECT // HYPERLOCAL ISSUE DISPATCH &amp; GEOLOCATION</text>
  <rect x="630" y="42" width="110" height="20" rx="3" fill="#E5252A"/>
  <text x="685" y="56" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">REPORT INCIDENT</text>

  <!-- Left Map Grid Mockup -->
  <rect x="40" y="90" width="420" height="320" rx="4" fill="#121212" stroke="#242424"/>
  <!-- Map streets schematic -->
  <path d="M40 180 L460 180 M40 280 L460 280 M180 90 L180 410 M320 90 L320 410" stroke="#1c1c1c" stroke-width="12"/>
  <path d="M100 90 L360 410 M40 330 L400 90" stroke="#181818" stroke-width="6"/>

  <!-- Active Geolocation Pins -->
  <!-- Pin 1 - Red High Priority -->
  <circle cx="180" cy="180" r="14" fill="#E5252A" opacity="0.3"/>
  <circle cx="180" cy="180" r="6" fill="#E5252A"/>
  <rect x="200" y="165" width="140" height="30" rx="3" fill="#191919" stroke="#E5252A"/>
  <text x="210" y="184" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Water Main Leak #402</text>

  <!-- Pin 2 - Moderate Priority -->
  <circle cx="320" cy="280" r="10" fill="#555555" opacity="0.4"/>
  <circle cx="320" cy="280" r="5" fill="#AAAAAA"/>
  <rect x="335" y="265" width="110" height="30" rx="3" fill="#191919" stroke="#333333"/>
  <text x="345" y="284" font-family="'Inter', sans-serif" font-size="10" fill="#CCCCCC">Road Hazard #399</text>

  <!-- Pin 3 - Resolved -->
  <circle cx="120" cy="300" r="5" fill="#44AA44"/>
  <text x="135" y="304" font-family="'Inter', sans-serif" font-size="9" fill="#44AA44">Resolved</text>

  <!-- Right Issue Details Triage -->
  <rect x="480" y="90" width="280" height="320" rx="4" fill="#131313" stroke="#242424"/>
  <text x="500" y="120" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#AAAAAA" letter-spacing="1">MUNICIPAL RESOLUTION PIPELINE</text>
  <line x1="500" y1="135" x2="740" y2="135" stroke="#222222"/>

  <!-- Ticket 1 -->
  <rect x="500" y="150" width="240" height="75" rx="3" fill="#1a1a1a" stroke="#E5252A"/>
  <text x="515" y="172" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#E5252A">#CIV-2026-402 • WATER MAIN</text>
  <text x="515" y="192" font-family="'Inter', sans-serif" font-size="10" fill="#DDDDDD">Sector 4 Crossroad • 12 Reports</text>
  <text x="515" y="210" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#AAAAAA">Assigned: Municipal Water Works</text>

  <!-- Ticket 2 -->
  <rect x="500" y="235" width="240" height="75" rx="3" fill="#161616"/>
  <text x="515" y="257" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#DDDDDD">#CIV-2026-399 • TRAFFIC LIGHT</text>
  <text x="515" y="277" font-family="'Inter', sans-serif" font-size="10" fill="#888888">5th Avenue Junction • In Triage</text>
  <text x="515" y="295" font-family="'Inter', sans-serif" font-size="9" fill="#666666">Field Crew Dispatched</text>

  <!-- Status pill -->
  <rect x="500" y="325" width="240" height="65" rx="3" fill="#161616"/>
  <text x="515" y="347" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#AAAAAA" letter-spacing="1">GEO RESOLUTION METRICS</text>
  <text x="515" y="372" font-family="'Bebas Neue', 'Impact', sans-serif" font-size="24" fill="#44AA44">91.4%</text>
  <text x="590" y="370" font-family="'Inter', sans-serif" font-size="10" fill="#888888">Closed within SLA</text>
</svg>
