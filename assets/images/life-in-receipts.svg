<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="grad-lr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#grad-lr)"/>
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#262626" stroke-width="2"/>

  <!-- Top bar -->
  <rect x="40" y="30" width="720" height="44" rx="4" fill="#141414" stroke="#292929"/>
  <circle cx="64" cy="52" r="5" fill="#E5252A"/>
  <circle cx="80" cy="52" r="5" fill="#444444"/>
  <circle cx="96" cy="52" r="5" fill="#444444"/>
  <text x="120" y="57" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#888888" letter-spacing="1">LIFE IN RECEIPTS // CONSUMER ANALYTICS &amp; VISUALIZATION</text>
  <rect x="630" y="42" width="110" height="20" rx="3" fill="#1d1d1d" stroke="#333333"/>
  <text x="685" y="56" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#AAAAAA" text-anchor="middle">Q4 REPORT</text>

  <!-- Left Main Chart: Spending Trend -->
  <rect x="40" y="90" width="460" height="320" rx="4" fill="#131313" stroke="#242424"/>
  <text x="65" y="120" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#AAAAAA" letter-spacing="1">EXPENDITURE HISTOGRAM &amp; TRENDS</text>
  <line x1="65" y1="135" x2="475" y2="135" stroke="#222222"/>

  <!-- Horizontal grid lines -->
  <line x1="85" y1="180" x2="475" y2="180" stroke="#1f1f1f" stroke-dasharray="3,3"/>
  <line x1="85" y1="230" x2="475" y2="230" stroke="#1f1f1f" stroke-dasharray="3,3"/>
  <line x1="85" y1="280" x2="475" y2="280" stroke="#1f1f1f" stroke-dasharray="3,3"/>
  <line x1="85" y1="330" x2="475" y2="330" stroke="#2a2a2a"/>

  <!-- Bars with accent highlighting -->
  <rect x="110" y="250" width="28" height="80" rx="2" fill="#292929"/>
  <rect x="160" y="210" width="28" height="120" rx="2" fill="#292929"/>
  <rect x="210" y="270" width="28" height="60" rx="2" fill="#292929"/>
  <rect x="260" y="170" width="28" height="160" rx="2" fill="#E5252A"/>
  <rect x="310" y="220" width="28" height="110" rx="2" fill="#292929"/>
  <rect x="360" y="190" width="28" height="140" rx="2" fill="#E5252A" opacity="0.8"/>
  <rect x="410" y="240" width="28" height="90" rx="2" fill="#292929"/>

  <text x="124" y="352" font-family="'Inter', sans-serif" font-size="10" fill="#666666" text-anchor="middle">AUG</text>
  <text x="174" y="352" font-family="'Inter', sans-serif" font-size="10" fill="#666666" text-anchor="middle">SEP</text>
  <text x="224" y="352" font-family="'Inter', sans-serif" font-size="10" fill="#666666" text-anchor="middle">OCT</text>
  <text x="274" y="352" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#E5252A" text-anchor="middle">NOV</text>
  <text x="324" y="352" font-family="'Inter', sans-serif" font-size="10" fill="#666666" text-anchor="middle">DEC</text>
  <text x="374" y="352" font-family="'Inter', sans-serif" font-size="10" fill="#666666" text-anchor="middle">JAN</text>
  <text x="424" y="352" font-family="'Inter', sans-serif" font-size="10" fill="#666666" text-anchor="middle">FEB</text>

  <!-- Right Distribution & Breakdown -->
  <rect x="520" y="90" width="240" height="320" rx="4" fill="#131313" stroke="#242424"/>
  <text x="540" y="120" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#AAAAAA" letter-spacing="1">CATEGORY SHARE</text>
  <line x1="540" y1="135" x2="740" y2="135" stroke="#222222"/>

  <!-- Category 1 -->
  <text x="540" y="170" font-family="'Inter', sans-serif" font-size="11" fill="#DDDDDD">Groceries &amp; Provisions</text>
  <text x="740" y="170" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#E5252A" text-anchor="end">42%</text>
  <rect x="540" y="180" width="200" height="6" rx="3" fill="#222222"/>
  <rect x="540" y="180" width="84" height="6" rx="3" fill="#E5252A"/>

  <!-- Category 2 -->
  <text x="540" y="220" font-family="'Inter', sans-serif" font-size="11" fill="#DDDDDD">Tech &amp; Subscriptions</text>
  <text x="740" y="220" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="end">28%</text>
  <rect x="540" y="230" width="200" height="6" rx="3" fill="#222222"/>
  <rect x="540" y="230" width="56" height="6" rx="3" fill="#444444"/>

  <!-- Category 3 -->
  <text x="540" y="270" font-family="'Inter', sans-serif" font-size="11" fill="#DDDDDD">Transit &amp; Travel</text>
  <text x="740" y="270" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="end">18%</text>
  <rect x="540" y="280" width="200" height="6" rx="3" fill="#222222"/>
  <rect x="540" y="280" width="36" height="6" rx="3" fill="#444444"/>

  <!-- Category 4 -->
  <text x="540" y="320" font-family="'Inter', sans-serif" font-size="11" fill="#DDDDDD">Dining &amp; Social</text>
  <text x="740" y="320" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="end">12%</text>
  <rect x="540" y="330" width="200" height="6" rx="3" fill="#222222"/>
  <rect x="540" y="330" width="24" height="6" rx="3" fill="#444444"/>

  <rect x="540" y="365" width="200" height="30" rx="3" fill="#181818" stroke="#282828"/>
  <text x="640" y="384" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#888888" text-anchor="middle">D3 SVG RENDERED ENGINE</text>
</svg>
