<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Dragon GLB 3D Inspection Viewer</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">LOADING CHINESE DRAGON (26.7 MB)</div>
    <div id="loading-subtext" class="loading-subtext">Initializing WebGL engine and parsing 273 joints...</div>
  </div>

  <!-- Header Info Panel -->
  <header class="viewer-header">
    <h1 class="viewer-title">CHINESE DRAGON 3D MODEL</h1>
    <p class="viewer-subtitle">Phase 1 GLB Validation &amp; Animation Inspector</p>
    <div class="stats-grid">
      <div class="stat-item">
        <span class="stat-label">Model File</span>
        <span class="stat-value">chinese_dragon.glb</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Joint Count</span>
        <span class="stat-value">273 Joints</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Triangles</span>
        <span class="stat-value">50,553 Tris</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Animation Clip</span>
        <span class="stat-value">Take 001 (57.5s)</span>
      </div>
    </div>
  </header>

  <!-- 3D Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Interactive Controls Toolbar -->
  <footer class="viewer-controls">
    <div class="timeline-row">
      <label for="time-slider" class="stat-label">Timeline</label>
      <input type="range" id="time-slider" class="timeline-slider" min="0" max="57.5" step="0.05" value="0">
      <span id="time-display" class="time-display">00:00 / 00:57</span>
    </div>
    <div class="actions-row">
      <div class="btn-group">
        <button type="button" id="btn-play-pause" class="viewer-btn">
          <span id="play-icon">⏸</span>
          <span id="play-text">Pause</span>
        </button>
        <button type="button" id="btn-restart" class="viewer-btn">
          <span>⏮</span>
          <span>Restart</span>
        </button>
        <button type="button" id="btn-wireframe" class="viewer-btn">
          <span>🕸</span>
          <span>Wireframe</span>
        </button>
        <button type="button" id="btn-skeleton" class="viewer-btn">
          <span>🦴</span>
          <span>Skeleton</span>
        </button>
      </div>
      <div class="btn-group">
        <label for="speed-select" class="stat-label">Speed:</label>
        <select id="speed-select" class="speed-select">
          <option value="0.25">0.25x</option>
          <option value="0.5">0.5x</option>
          <option value="1.0" selected>1.0x</option>
          <option value="1.5">1.5x</option>
          <option value="2.0">2.0x</option>
        </select>
        <button type="button" id="btn-reset-cam" class="viewer-btn">
          <span>🎯</span>
          <span>Reset View</span>
        </button>
      </div>
    </div>
  </footer>

  <!-- Viewer Logic -->
  <script type="module">
    import * as THREE from './libs/three.module.js';
    import { GLTFLoader } from './libs/GLTFLoader.js';
    import { OrbitControls } from './libs/OrbitControls.js';

    const container = document.getElementById('canvas-container');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingSubtext = document.getElementById('loading-subtext');
    const timeSlider = document.getElementById('time-slider');
    const timeDisplay = document.getElementById('time-display');
    const btnPlayPause = document.getElementById('btn-play-pause');
    const playIcon = document.getElementById('play-icon');
    const playText = document.getElementById('play-text');
    const btnRestart = document.getElementById('btn-restart');
    const btnWireframe = document.getElementById('btn-wireframe');
    const btnSkeleton = document.getElementById('btn-skeleton');
    const speedSelect = document.getElementById('speed-select');
    const btnResetCam = document.getElementById('btn-reset-cam');

    // Scene & Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xe5252a, 3.5);
    keyLight.position.set(10, 15, 10);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 1.2);
    fillLight.position.set(-10, -5, -10);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xff3333, 2.0);
    rimLight.position.set(0, 10, -15);
    scene.add(rimLight);

    // Grid Floor
    const gridHelper = new THREE.GridHelper(30, 30, 0xe5252a, 0x222222);
    gridHelper.position.y = -3;
    scene.add(gridHelper);

    // Model State
    let dragonModel = null;
    let mixer = null;
    let currentAction = null;
    let skeletonHelper = null;
    let isPlaying = true;
    let isWireframe = false;
    let showSkeleton = false;
    let clipDuration = 57.5;
    let isDraggingSlider = false;

    // Load Model
    const loader = new GLTFLoader();
    loader.load(
      'chinese_dragon.glb',
      (gltf) => {
        dragonModel = gltf.scene;

        // Compute Bounding Box & Normalize Center/Scale
        const box = new THREE.Box3().setFromObject(dragonModel);
        const size = new THREE.Vector3();
        box.getSize(size);
        const center = new THREE.Vector3();
        box.getCenter(center);

        const maxDim = Math.max(size.x, size.y, size.z);
        const targetScale = 12.0 / maxDim; // Normalize to approx 12 units long
        dragonModel.scale.setScalar(targetScale);

        // Center on grid
        dragonModel.position.x = -center.x * targetScale;
        dragonModel.position.y = -center.y * targetScale;
        dragonModel.position.z = -center.z * targetScale;

        scene.add(dragonModel);

        // Materials setup
        dragonModel.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        // Skeleton Helper
        skeletonHelper = new THREE.SkeletonHelper(dragonModel);
        skeletonHelper.material.linewidth = 2;
        skeletonHelper.visible = false;
        scene.add(skeletonHelper);

        // Animation Mixer setup
        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(dragonModel);
          const clip = gltf.animations[0];
          clipDuration = clip.duration;
          timeSlider.max = clipDuration;

          currentAction = mixer.clipAction(clip);
          currentAction.play();
        }

        // Hide Loading Overlay
        loadingOverlay.classList.add('hidden');
        console.log('✅ Chinese Dragon GLB successfully loaded and ready for inspection!');
      },
      (xhr) => {
        if (xhr.lengthComputable) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          loadingSubtext.textContent = `Downloading GLB: ${percent}% (${(xhr.loaded / 1048576).toFixed(1)} MB / ${(xhr.total / 1048576).toFixed(1)} MB)`;
        }
      },
      (error) => {
        console.error('Error loading GLB:', error);
        loadingSubtext.textContent = 'Failed to load model. Check console.';
      }
    );

    // Controls Handlers
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    btnPlayPause.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        if (currentAction) currentAction.paused = false;
        playIcon.textContent = '⏸';
        playText.textContent = 'Pause';
      } else {
        if (currentAction) currentAction.paused = true;
        playIcon.textContent = '▶';
        playText.textContent = 'Play';
      }
    });

    btnRestart.addEventListener('click', () => {
      if (currentAction) {
        currentAction.reset();
        currentAction.play();
        isPlaying = true;
        playIcon.textContent = '⏸';
        playText.textContent = 'Pause';
      }
    });

    btnWireframe.addEventListener('click', () => {
      isWireframe = !isWireframe;
      btnWireframe.classList.toggle('active', isWireframe);
      if (dragonModel) {
        dragonModel.traverse((child) => {
          if (child.isMesh && child.material) {
            child.material.wireframe = isWireframe;
          }
        });
      }
    });

    btnSkeleton.addEventListener('click', () => {
      showSkeleton = !showSkeleton;
      btnSkeleton.classList.toggle('active', showSkeleton);
      if (skeletonHelper) {
        skeletonHelper.visible = showSkeleton;
      }
    });

    speedSelect.addEventListener('change', (e) => {
      const speed = parseFloat(e.target.value);
      if (currentAction) {
        currentAction.setEffectiveTimeScale(speed);
      }
    });

    btnResetCam.addEventListener('click', () => {
      camera.position.set(0, 5, 18);
      controls.target.set(0, 0, 0);
      controls.update();
    });

    timeSlider.addEventListener('input', (e) => {
      isDraggingSlider = true;
      const t = parseFloat(e.target.value);
      if (currentAction && mixer) {
        currentAction.time = t;
        mixer.update(0);
      }
      timeDisplay.textContent = `${formatTime(t)} / ${formatTime(clipDuration)}`;
    });

    timeSlider.addEventListener('change', () => {
      isDraggingSlider = false;
    });

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Render Loop
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      if (mixer && isPlaying && !isDraggingSlider) {
        mixer.update(delta);
        if (currentAction) {
          const currentTime = currentAction.time % clipDuration;
          timeSlider.value = currentTime;
          timeDisplay.textContent = `${formatTime(currentTime)} / ${formatTime(clipDuration)}`;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
